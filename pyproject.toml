[tool.poetry]
name = "fastapi-starter"
version = "0.1.0"
description = "FastAPI backend starter template"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
pydantic = "^2.9.2"
pydantic-settings = "^2.5.2"
python-multipart = "^0.0.12"
python-dotenv = "^1.0.1"
httpx = "^0.27.2"
numpy = "^2.1.3"
pyyaml = "^6.0.2"
pyarrow = "^18.0.0"
scikit-learn = "^1.5.2"
lightgbm = "^4.5.0"
skl2onnx = "1.19.1"
onnx = "1.17.0"
onnxruntime = "^1.20.0"
onnxmltools = "^1.12.0"
joblib = "^1.4.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
ruff = "^0.7.0"
black = "^24.10.0"
mypy = "^1.13.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
